<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>iubabi · Những lá thư</title>
  <meta name="description" content="Nơi đọc và gửi những lá thư.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💌</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Lora:ital,wght@0,400;0,600;1,400;1,600&display=swap">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="wrap">
    <header class="site-header">
      <div>
        <h1 class="brand" id="siteTitle">iubabi</h1>
        <p class="tagline" id="siteTagline">Những lá thư gửi nhau</p>
      </div>
      <button class="btn btn-primary" id="btnWrite" type="button">Viết thư</button>
    </header>

    <div class="notice" id="demoNotice" hidden>
      <strong>Chế độ thử.</strong> Chưa cấu hình <code>API_URL</code> trong <code>config.js</code>,
      nên thư chỉ được lưu tạm trên trình duyệt này. Xem <code>README.md</code> để nối với Google Sheets.
    </div>

    <div class="toolbar">
      <div class="tabs" role="tablist" aria-label="Lọc thư">
        <button type="button" role="tab" data-filter="all" aria-selected="true">Tất cả <span class="count" data-count="all"></span></button>
        <button type="button" role="tab" data-filter="owner" aria-selected="false">Thư của tôi <span class="count" data-count="owner"></span></button>
        <button type="button" role="tab" data-filter="guest" aria-selected="false">Thư mọi người <span class="count" data-count="guest"></span></button>
      </div>
      <input class="search" type="search" id="search" placeholder="Tìm theo tiêu đề, người viết, nội dung…" aria-label="Tìm thư">
    </div>

    <main>
      <p class="status" id="status">Đang tải thư…</p>
      <div class="grid" id="grid"></div>
    </main>

    <footer class="site-footer">Thư được lưu trữ trên Google Sheets.</footer>
  </div>

  <dialog id="readDialog" class="sheet">
    <article class="letter">
      <button type="button" class="icon-btn close" data-close aria-label="Đóng">×</button>
      <p class="badge" id="readBadge"></p>
      <h2 class="letter-title" id="readTitle"></h2>
      <p class="letter-date" id="readDate"></p>
      <div class="letter-body" id="readBody"></div>
      <p class="letter-sign" id="readAuthor"></p>
      <div class="letter-actions">
        <button type="button" class="btn btn-ghost" id="btnCopyLink">Sao chép liên kết</button>
      </div>
    </article>
  </dialog>

  <dialog id="writeDialog" class="sheet">
    <form id="writeForm" class="write-form" novalidate>
      <div class="form-head">
        <h2>Viết một lá thư</h2>
        <button type="button" class="icon-btn" data-close aria-label="Đóng">×</button>
      </div>

      <label class="field">
        <span>Tên của bạn</span>
        <input name="author" maxlength="50" placeholder="Để trống nếu muốn ẩn danh" autocomplete="nickname">
      </label>
      <label class="field">
        <span>Tiêu đề</span>
        <input name="title" maxlength="120" placeholder="Gửi…">
      </label>
      <label class="field">
        <span>Nội dung <small id="charCount">0 / 5000</small></span>
        <textarea name="content" rows="10" maxlength="5000" required placeholder="Viết điều bạn muốn nói…"></textarea>
      </label>

      <!-- Bẫy chống bot: người thật không nhìn thấy ô này -->
      <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">

      <details class="owner-box">
        <summary>Tôi là chủ trang</summary>
        <label class="field">
          <span>Mã chủ trang</span>
          <input name="ownerKey" type="password" autocomplete="current-password">
        </label>
        <label class="check">
          <input type="checkbox" name="rememberKey"> Ghi nhớ mã trên máy này
        </label>
      </details>

      <p class="form-error" id="formError" hidden></p>

      <div class="form-actions">
        <button type="button" class="btn btn-ghost" data-close>Hủy</button>
        <button type="submit" class="btn btn-primary" id="btnSend">Gửi thư</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="config.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
