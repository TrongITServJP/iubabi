<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#fbf4ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1d1718" media="(prefers-color-scheme: dark)">
  <title>iubabi</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="iubabi">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Dancing+Script:wght@500;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <section class="lock" id="lock" hidden>
    <div class="lock-card">
      <svg class="hero-heart" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.3C1 8.4 3 5 6.4 5c2 0 3.3 1 4.1 2.2h3C14.3 6 15.6 5 17.6 5 21 5 23 8.4 21.6 11.7 19.5 16.4 12 21 12 21z"/></svg>
      <h1 class="brand" data-site-title>iubabi</h1>
      <p class="lock-note">Nơi này chỉ dành cho hai mình</p>
      <form class="lock-form" id="lockForm" novalidate>
        <label class="field">
          <span>Mã bí mật</span>
          <input name="key" type="password" autocomplete="current-password" required>
        </label>
        <label class="check">
          <input type="checkbox" name="remember" checked> Ghi nhớ trên máy này
        </label>
        <p class="form-error" id="lockError" hidden></p>
        <button type="submit" class="btn btn-primary" id="btnUnlock">Mở thư</button>
      </form>
    </div>
  </section>

  <div id="app" hidden>
    <div class="wrap">
      <button type="button" class="icon-btn lock-btn" id="btnLock" aria-label="Khóa lại" title="Khóa lại">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      </button>

      <header class="hero">
        <svg class="hero-heart" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.3C1 8.4 3 5 6.4 5c2 0 3.3 1 4.1 2.2h3C14.3 6 15.6 5 17.6 5 21 5 23 8.4 21.6 11.7 19.5 16.4 12 21 12 21z"/></svg>
        <h1 class="brand" data-site-title>iubabi</h1>
        <p class="tagline" id="siteTagline">Những lá thư gửi nhau</p>
        <p class="hero-stat" id="heroStat" hidden></p>
        <div class="hero-actions">
          <button class="btn btn-primary hero-write" type="button" data-write>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4zM14 6l4 4"/></svg>
            Viết thư
          </button>
          <button class="btn btn-ghost" type="button" id="btnInstall" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
            Tải app
          </button>
          <button class="btn btn-ghost" type="button" id="btnNotify" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15L6 16zM10 20a2 2 0 0 0 4 0"/></svg>
            Bật thông báo
          </button>
        </div>
      </header>

      <div class="notice" id="demoNotice" hidden>
        <strong>Chế độ thử.</strong> Chưa cấu hình <code>API_URL</code> trong <code>config.js</code>,
        nên thư chỉ được lưu tạm trên trình duyệt này.
      </div>

      <div class="toolbar">
        <div class="tabs" role="tablist" aria-label="Lọc thư">
          <button type="button" role="tab" data-filter="all" aria-selected="true">Tất cả <span class="count" data-count="all"></span></button>
          <button type="button" role="tab" data-filter="owner" aria-selected="false">Thư của anh <span class="count" data-count="owner"></span></button>
          <button type="button" role="tab" data-filter="partner" aria-selected="false">Thư của em <span class="count" data-count="partner"></span></button>
        </div>
        <label class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
          <input type="search" id="search" placeholder="Tìm thư…" aria-label="Tìm thư">
        </label>
      </div>

      <main>
        <p class="status" id="status" hidden></p>
        <div class="grid" id="grid"></div>
      </main>
    </div>

    <button class="fab" type="button" data-write aria-label="Viết thư">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4zM14 6l4 4"/></svg>
    </button>
  </div>

  <dialog id="readDialog" class="sheet" aria-labelledby="readTitle">
    <div class="sheet-bar">
      <button type="button" class="icon-btn" data-nav="-1" aria-label="Thư trước">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <span class="sheet-pos" id="readPos"></span>
      <button type="button" class="icon-btn" data-nav="1" aria-label="Thư sau">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
      <span class="spacer"></span>
      <button type="button" class="icon-btn" id="btnCopyLink" aria-label="Sao chép liên kết">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
      </button>
      <button type="button" class="icon-btn" data-close aria-label="Đóng">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <article class="letter" id="readLetter" tabindex="-1" autofocus>
      <p class="letter-dateline" id="readDateline"></p>
      <h2 class="letter-title" id="readTitle"></h2>
      <div class="letter-body" id="readBody"></div>
      <p class="letter-sign" id="readAuthor"></p>
      <svg class="letter-seal" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.3C1 8.4 3 5 6.4 5c2 0 3.3 1 4.1 2.2h3C14.3 6 15.6 5 17.6 5 21 5 23 8.4 21.6 11.7 19.5 16.4 12 21 12 21z"/></svg>
    </article>
  </dialog>

  <dialog id="writeDialog" class="sheet" aria-labelledby="writeHeading">
    <form id="writeForm" class="write-form" novalidate>
      <div class="form-head">
        <h2 id="writeHeading">Viết một lá thư</h2>
        <button type="button" class="icon-btn" data-close aria-label="Đóng">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <div class="field-row">
        <label class="field">
          <span>Ký tên</span>
          <input name="author" maxlength="50" autocomplete="nickname">
        </label>
        <label class="field">
          <span>Tiêu đề</span>
          <input name="title" maxlength="120" placeholder="Không bắt buộc">
        </label>
      </div>
      <label class="field">
        <span>Nội dung <small id="charCount">0 / 5000</small></span>
        <textarea name="content" rows="10" maxlength="5000" required placeholder="Thành phố Hồ Chí Minh, ngày … tháng … năm …"></textarea>
      </label>

      <p class="form-error" id="formError" hidden></p>

      <div class="form-actions">
        <button type="button" class="btn btn-ghost" data-close>Hủy</button>
        <button type="submit" class="btn btn-primary" id="btnSend">Gửi thư</button>
      </div>
    </form>
  </dialog>

  <dialog id="helpDialog" class="sheet" aria-labelledby="helpTitle">
    <div class="help">
      <div class="form-head">
        <h2 id="helpTitle"></h2>
        <button type="button" class="icon-btn" data-close aria-label="Đóng">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="help-body" id="helpBody" tabindex="-1" autofocus></div>
      <div class="form-actions">
        <button type="button" class="btn btn-primary" data-close>Đã hiểu</button>
      </div>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="config.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
